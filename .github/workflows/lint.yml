name: Lint & Smoke Checks

on:
  push:
    branches: [ main, 'blackboxai/**', 'ci/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r RoomZero/requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Pip check
        run: pip check
      - name: Run pytest
        run: pytest -q
      - name: Run ruff
        run: ruff check RoomZero/app RoomZero/tests RoomZero/scripts
      - name: Validate JavaScript syntax
        run: |
          node --check RoomZero/app/static/app.js
          node --check RoomZero/app/static/service-worker.js
